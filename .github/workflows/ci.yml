name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]

defaults:
  run:
    shell: bash

jobs:
  linux-debug-build:
    name: Linux Debug
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: arthurrl/vulkan-dev:lts
      options: --user 0
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install C++ quality tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-format-21 clang-tidy-21

      - name: Check C++ formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/check-cpp.py format --base "$BASE_SHA"

      - name: Configure
        # Mirrors CMakePresets.json's "linux-debug" preset rather than using
        # it directly, since that preset's CMAKE_PREFIX_PATH is wired through
        # $env{LOCAL_PREFIX}, which isn't set to anything useful here.
        run: >
          cmake -S . -B build/linux/debug -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DCMAKE_CXX_SCAN_FOR_MODULES=OFF
          -DWMA_BUILD_EXAMPLES=ON
          -DWMA_BUILD_TESTS=ON
          -DWMA_ENABLE_SDL=ON
          -DWMA_ENABLE_X11=ON
          -DWMA_ENABLE_WAYLAND=ON

      - name: Build
        run: cmake --build build/linux/debug --parallel

      - name: Lint C++ changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 ci/check-cpp.py lint --base "$BASE_SHA" --build build/linux/debug

      - name: Run tests
        run: ctest --test-dir build/linux/debug --output-on-failure

  linux-release-build:
    name: Linux Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        # See linux-debug-build's Configure step for why this mirrors the
        # "linux-release" preset instead of using it directly.
        run: >
          cmake -S . -B build/linux/release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWMA_BUILD_EXAMPLES=ON
          -DWMA_BUILD_TESTS=ON
          -DWMA_ENABLE_SDL=ON
          -DWMA_ENABLE_X11=ON
          -DWMA_ENABLE_WAYLAND=ON

      - name: Build
        run: cmake --build build/linux/release --parallel

      - name: Run tests
        run: ctest --test-dir build/linux/release --output-on-failure

  backend-matrix-build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: sdl-only
            cmake_flags: >-
              -DWMA_ENABLE_SDL=ON -DWMA_ENABLE_GLFW=OFF
              -DWMA_ENABLE_X11=OFF -DWMA_ENABLE_WAYLAND=OFF
          - name: glfw-only
            cmake_flags: >-
              -DWMA_ENABLE_SDL=OFF -DWMA_ENABLE_GLFW=ON
              -DWMA_ENABLE_X11=OFF -DWMA_ENABLE_WAYLAND=OFF
          - name: x11-only
            cmake_flags: >-
              -DWMA_ENABLE_SDL=OFF -DWMA_ENABLE_GLFW=OFF
              -DWMA_ENABLE_X11=ON -DWMA_ENABLE_WAYLAND=OFF
          - name: wayland-only
            cmake_flags: >-
              -DWMA_ENABLE_SDL=OFF -DWMA_ENABLE_GLFW=OFF
              -DWMA_ENABLE_X11=OFF -DWMA_ENABLE_WAYLAND=ON

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DWMA_BUILD_EXAMPLES=ON
          ${{ matrix.cmake_flags }}

      - name: Build
        run: cmake --build build --parallel

  wasm-build:
    name: WASM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: |
          source /opt/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-wasm \
            -DCMAKE_BUILD_TYPE=Release \
            -DWMA_BUILD_EXAMPLES=ON \
            -DWMA_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="/usr/local/wasm;/usr/local" \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

      - name: Build
        run: |
          source /opt/emsdk/emsdk_env.sh
          cmake --build build-wasm --parallel

  android-build:
    name: Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: arthurrl/vulkan-dev:lts
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build-android -G Ninja
          -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-29
          -DANDROID_STL=c++_shared
          -DCMAKE_BUILD_TYPE=Release
          -DWMA_BUILD_EXAMPLES=ON
          -DWMA_BUILD_TESTS=OFF
          -DCMAKE_PREFIX_PATH="/usr/local/android;/usr/local"
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH

      - name: Build
        run: cmake --build build-android --parallel

  macos-build:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 30

    # Exercises the Metal path: cmake/Platform.cmake forces X11/Wayland off on
    # Apple, leaving SDL3 and GLFW — the two backends that can host a
    # CAMetalLayer — and turning on WMA_HAS_METAL, which is what compiles
    # src/platform/apple/AppleMetalLayer.mm and the Objective-C++ language support
    # for it.
    steps:
      - name: Checkout wma
        uses: actions/checkout@v4
        with:
          path: wma

      - name: Checkout ink
        # macos-latest has no vulkan-dev container to pull a prebuilt ink from
        # (unlike the Linux/Android/WASM jobs above), so build+install the ink
        # dependency from source here into a local prefix — same approach as
        # windows-build below.
        uses: actions/checkout@v4
        with:
          repository: Arthu-RL/libink
          ref: main
          path: ink

      - name: Install dependencies (Homebrew)
        # nlohmann-json is ink's dependency; sdl3/glfw are wma's. QuartzCore,
        # Foundation and AppKit need no package — they ship with the Xcode SDK
        # macos-latest already has. Ninja matches CMakePresets.json's generator.
        run: brew install ninja sdl3 glfw nlohmann-json

      - name: Configure ink
        run: >
          cmake -S ink -B ink/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DINK_BUILD_TESTS=OFF
          -DINK_NATIVE_OPTIMIZE=OFF

      - name: Build ink
        run: cmake --build ink/build --parallel

      - name: Install ink
        run: cmake --install ink/build --prefix ink/stage

      - name: Configure wma
        # Mirrors CMakePresets.json's "macos-release" preset (deployment target,
        # backend set) rather than using it directly, since that preset's
        # CMAKE_PREFIX_PATH is wired through $env{LOCAL_PREFIX}, which isn't set
        # to anything useful here.
        run: >
          cmake -S wma -B wma/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/ink/stage"
          -DWMA_BUILD_EXAMPLES=ON
          -DWMA_BUILD_TESTS=OFF
          -DWMA_ENABLE_SDL=ON
          -DWMA_ENABLE_GLFW=ON

      - name: Build wma
        run: cmake --build wma/build --parallel

  ios-build:
    name: iOS (build only)
    runs-on: macos-latest
    timeout-minutes: 60

    # Build-only: nothing here drives a simulator, and an on-device run needs a
    # signing identity this workflow has no business holding. What it proves is
    # that the SDL3 backend and the Metal layer accessor compile and link for
    # arm64-apple-ios.
    #
    # SDL3 is built from source rather than installed: Homebrew ships
    # macOS-native binaries only, so its sdl3 bottle cannot be linked into an
    # iOS target.
    #
    # 16.3 is the floor rather than 16.0 because libc++'s <format> is
    # availability-gated: its floating-point path calls std::to_chars, which
    # Apple marks as introduced in iOS 16.3, so ink (which formats its log
    # timestamps with std::format_to) does not compile below it. All three
    # builds below use the same value so nothing links against a slice with a
    # different minimum.
    steps:
      - name: Checkout wma
        uses: actions/checkout@v4
        with:
          path: wma

      - name: Checkout ink
        uses: actions/checkout@v4
        with:
          repository: Arthu-RL/libink
          ref: main
          path: ink

      - name: Checkout SDL3
        uses: actions/checkout@v4
        with:
          repository: libsdl-org/SDL
          ref: release-3.2.x
          path: SDL

      - name: Install host tools (Homebrew)
        # nlohmann-json is header-only, so ink's macOS-native package config is
        # usable from an iOS target as long as find_package can see it — hence
        # CMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH below (the "base" preset sets
        # the same thing).
        run: brew install ninja nlohmann-json

      - name: Build and install SDL3 for iOS
        run: |
          cmake -S SDL -B SDL/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSDL_SHARED=OFF \
            -DSDL_STATIC=ON \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF
          cmake --build SDL/build-ios --parallel
          cmake --install SDL/build-ios --prefix deps-ios

      - name: Build and install ink for iOS
        run: |
          cmake -S ink -B ink/build-ios -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH \
            -DINK_BUILD_TESTS=OFF \
            -DINK_NATIVE_OPTIMIZE=OFF
          cmake --build ink/build-ios --parallel
          cmake --install ink/build-ios --prefix deps-ios

      - name: Configure wma
        # Mirrors CMakePresets.json's "ios" preset. WMA_ENABLE_GLFW,
        # WMA_BUILD_EXAMPLES and WMA_BUILD_TESTS are forced off for iOS by
        # cmake/Platform.cmake, so they are not repeated here.
        run: >
          cmake -S wma -B wma/build-ios -G Ninja
          -DCMAKE_SYSTEM_NAME=iOS
          -DCMAKE_OSX_SYSROOT=iphoneos
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=16.3
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_FIND_ROOT_PATH_MODE_PACKAGE=BOTH
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/deps-ios"
          -DWMA_ENABLE_SDL=ON

      - name: Build wma
        run: cmake --build wma/build-ios --parallel

  windows-build:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout wma
        uses: actions/checkout@v4
        with:
          path: wma

      - name: Checkout ink
        # windows-latest has no vulkan-dev container to pull a prebuilt ink
        # from (unlike the Linux/Android/WASM jobs above), so build+install
        # the ink dependency from source here into a local prefix; wma's own
        # Configure step below points CMAKE_PREFIX_PATH at it.
        uses: actions/checkout@v4
        with:
          repository: Arthu-RL/libink
          ref: main
          path: ink

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Install dependencies (vcpkg)
        # windows-latest ships vcpkg preinstalled at $VCPKG_INSTALLATION_ROOT.
        # nlohmann_json is ink's dependency; SDL3/GLFW are wma's. The static
        # triplet builds these ports against the static CRT (/MT), which is why
        # every Configure step below passes CMAKE_MSVC_RUNTIME_LIBRARY: CMake
        # otherwise defaults the project itself to /MD and the link fails with
        # LNK2038.
        run: >
          vcpkg install
          nlohmann-json:x64-windows-static
          sdl3:x64-windows-static
          glfw3:x64-windows-static

      - name: Configure ink
        run: >
          cmake -S ink -B ink/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"
          -DINK_BUILD_TESTS=OFF
          -DINK_NATIVE_OPTIMIZE=OFF

      - name: Build ink
        run: cmake --build ink/build --parallel

      - name: Install ink
        run: cmake --install ink/build --prefix ink/stage

      - name: Configure wma
        # WMA_ENABLE_X11/WAYLAND are Linux-only (cmake/Dependencies.cmake
        # forces them off on Windows) so only SDL3/GLFW are requested here.
        run: >
          cmake -S wma -B wma/build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static
          -DCMAKE_MSVC_RUNTIME_LIBRARY="MultiThreaded$<$<CONFIG:Debug>:Debug>"
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/ink/stage"
          -DWMA_BUILD_EXAMPLES=ON
          -DWMA_BUILD_TESTS=OFF
          -DWMA_ENABLE_SDL=ON
          -DWMA_ENABLE_GLFW=ON

      - name: Build wma
        run: cmake --build wma/build --parallel
